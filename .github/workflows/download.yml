name: download

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp

      - name: Create folders
        run: |
          mkdir -p downloads
          mkdir -p split

      - name: Download media
        run: |
          yt-dlp \
          --no-playlist \
          -o "downloads/video.%(ext)s" \
          "${{ github.event.inputs.url }}"

      - name: Split large file
        run: |
          FILE=$(find downloads -type f | head -n 1)

          split -b 95M "$FILE" split/part_

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add split/

          git commit -m "Add split files" || echo "Nothing to commit"

          git push
