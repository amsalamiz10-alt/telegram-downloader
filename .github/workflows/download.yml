name: download

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          pip install -U yt-dlp

      - name: Create download folder
        run: |
          mkdir -p downloads

      - name: Download media
        run: |
          yt-dlp \
          --no-playlist \
          -o "downloads/%(title)s.%(ext)s" \
          "${{ github.event.inputs.url }}"

      - name: Get filename
        id: file
        run: |
          FILE=$(ls downloads | head -n 1)
          echo "name=$FILE" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_id }}
          name: Downloaded File
          files: downloads/*
