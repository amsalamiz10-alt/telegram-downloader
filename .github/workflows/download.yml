name: Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Telegram public post URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install gallery-dl
        run: pip install gallery-dl

      - name: Download
        run: |
          mkdir downloads
          gallery-dl -D downloads "${{ github.event.inputs.url }}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: telegram-files
          path: downloads/
