name: Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Telegram file URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Download from Telegram
        run: |
          mkdir downloads
          wget "${{ github.event.inputs.url }}" -O downloads/file

      - name: Upload file
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: downloads/
