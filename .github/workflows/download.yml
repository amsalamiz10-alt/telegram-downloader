name: Telegram Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Telegram URL"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Download
        run: |
          mkdir downloads
          yt-dlp "${{ github.event.inputs.url }}" -o "downloads/%(title)s.%(ext)s"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-download
          path: downloads/
